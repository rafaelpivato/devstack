# One-time asset generation and dependency audit; remove before I7 integration merge.
name: Bootstrap I7 frontend bundle
on:
  push:
    branches: [feat/v060-final-ux-parity]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.repository == 'rafaelpivato/devstack'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install and dependency audit
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm install --save-dev --save-exact --ignore-scripts vite@7.3.7 vitest@3.2.7
          npm audit fix --ignore-scripts
          npm audit --audit-level=low
          npm audit --json > /tmp/devstack-npm-audit.json || true
          node -e "const a=require('/tmp/devstack-npm-audit.json'); console.log(JSON.stringify({counts:a.metadata?.vulnerabilities,packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"
          npm audit --omit=dev
      - name: Build tracked browser bundle
        working-directory: frontend
        run: npm run build
      - name: Commit immutable assets
        run: |
          git add -f src/devstack/static/v06/manifest.json src/devstack/static/v06/assets
          git add frontend/package.json frontend/package-lock.json
          git add -u src/devstack/static/v06
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(v0.6 I7): track final UX bundle"
          git push origin HEAD:feat/v060-final-ux-parity
