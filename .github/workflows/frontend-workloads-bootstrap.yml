# One-time branch-local I5 bundle generation. Remove before merging.
name: Bootstrap I5 frontend bundle
on:
  push:
    branches: [feat/v060-services-apps-jobs]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.repository == 'rafaelpivato/devstack'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build browser bundle
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Commit versioned assets
        run: |
          git add -f src/devstack/static/v06/manifest.json src/devstack/static/v06/assets
          git add -u src/devstack/static/v06
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(v0.6 I5): track workload browser bundle"
          git push origin HEAD:feat/v060-services-apps-jobs
