name: Publish verified release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: devstack-release-main
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version and check whether already released
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Release version must be MAJOR.MINOR.PATCH")
          tag = f"v{version}"
          notes = Path("docs/releases") / f"{tag}.md"
          if not notes.is_file():
              raise SystemExit(f"Release notes are required: {notes}")
          import json
          frontend_version = json.loads(Path("frontend/package.json").read_text())["version"]
          if frontend_version != version:
              raise SystemExit(f"Frontend version {frontend_version} disagrees with package {version}")
          found = subprocess.run(
              ["git", "show-ref", "--verify", "--quiet", f"refs/tags/{tag}"],
              check=False,
          ).returncode == 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tag={tag}", file=output)
              print(f"publish={'false' if found else 'true'}", file=output)
          print(f"{tag}: {'already tagged' if found else 'awaiting verification'}")
          PY

  frontend-verification:
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read

  docker-verification:
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    uses: ./.github/workflows/docker-smoke.yml
    permissions:
      contents: read

  publish:
    needs: [candidate, frontend-verification, docker-verification]
    if: needs.candidate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application
        run: python -m pip install -e .
      - name: Run full unit tests
        run: python -m unittest discover -s tests -v
      - name: Publish verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          test -s "docs/releases/$TAG.md"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "docs/releases/$TAG.md"
