name: Publish verified release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: devstack-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Determine version and check whether already released
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Release version must be MAJOR.MINOR.PATCH")
          tag = f"v{version}"
          found = subprocess.run(
              ["git", "show-ref", "--verify", "--quiet", f"refs/tags/{tag}"],
              check=False,
          ).returncode == 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tag={tag}", file=output)
              print(f"publish={'false' if found else 'true'}", file=output)
          print(f"{tag}: {'already tagged' if found else 'ready to publish'}")
          PY
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --generate-notes --title "$TAG"
