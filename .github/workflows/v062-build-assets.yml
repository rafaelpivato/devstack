name: v0.6.2 temporary deterministic asset generation
on:
  push:
    branches:
      - integration/v062-stabilization
    paths:
      - .github/workflows/v062-build-assets.yml
permissions:
  contents: write
concurrency:
  group: devstack-v062-assets
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit
      - name: Full security audit
        working-directory: frontend
        run: node scripts/verified-audit.mjs
      - name: Typecheck and frontend tests
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
      - name: Rebuild immutable shipped assets
        working-directory: frontend
        run: npm run build
      - name: Commit only reproducible generated assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/devstack/static/v06
          if git diff --cached --quiet; then
            echo "No asset changes required"
          else
            git commit -m "build: regenerate v0.6.2 deterministic React assets"
            git push origin "HEAD:integration/v062-stabilization"
          fi
