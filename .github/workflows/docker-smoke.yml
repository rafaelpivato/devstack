name: Docker smoke integration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Compose
        run: docker compose version
      - name: Start smoke stack and verify health
        run: |
          set -euo pipefail
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke up -d --build --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:18080/health
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke ps
      - name: Validate imported Compose path base
        run: |
          set -euo pipefail
          tempdir="$(mktemp -d)"
          cp examples/smoke/.devstack/compose.yaml "$tempdir/compose.yaml"
          docker compose -p devstack-import-smoke \
            --project-directory "$PWD/examples/smoke/.devstack" \
            -f "$tempdir/compose.yaml" config --format json > "$tempdir/resolved.json"
          python3 - "$tempdir/resolved.json" "$PWD/examples/smoke/app" <<'PY'
          import json, pathlib, sys
          with open(sys.argv[1]) as stream:
              data = json.load(stream)
          actual = pathlib.Path(data["services"]["web"]["build"]["context"])
          expected = pathlib.Path(sys.argv[2])
          assert actual == expected, f"Expected build context {expected}, got {actual}"
          PY
      - name: Test Compose exec and one-off task commands
        run: |
          set -euo pipefail
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke \
            exec -T web python -m unittest discover -v
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke \
            run --rm --no-deps -T web python -m unittest discover -v
      - name: Test isolated images and optional Compose network
        run: |
          set -euo pipefail
          docker run --rm --network none --security-opt no-new-privileges \
            --cap-drop ALL python:3.12-alpine python --version
          network="$(docker network ls --quiet \
            --filter label=com.docker.compose.project=devstack-smoke \
            --filter label=com.docker.compose.network=default)"
          test "$(printf '%s\n' "$network" | sed '/^$/d' | wc -l)" -eq 1
          docker run --rm --network "$network" --security-opt no-new-privileges \
            --cap-drop ALL redis:7-alpine redis-cli -h redis ping
      - name: Verify explicit webhook forwarding to actual Compose container
        run: |
          set -euo pipefail
          python3 -m venv /tmp/devstack-webhook-ci
          /tmp/devstack-webhook-ci/bin/pip install -q -e .
          /tmp/devstack-webhook-ci/bin/python - <<'PY'
          from pathlib import Path
          import tempfile
          from unittest.mock import patch
          from devstack.applications import Application
          from devstack.core import Project
          from devstack import runtime
          from devstack.webhooks import Webhook, create_webhook_app

          compose = Path.cwd() / "examples/smoke/.devstack/compose.yaml"
          with tempfile.TemporaryDirectory() as temporary:
           root = Path(temporary)
           with (
              patch("devstack.runtime._folder", return_value=root),
              patch("devstack.webhooks.load_projects",
                    return_value={"smoke": Project("smoke", (), ())}),
              patch("devstack.webhooks.load_webhooks", return_value=(
                  Webhook("test", "Web", "/webhooks/smoke"),
              )),
              patch("devstack.webhooks.load_applications", return_value=(
                  Application("Web", "web", 8000),
              )),
              patch("devstack.webhooks.compose_name", return_value="devstack-smoke"),
              patch("devstack.webhooks.compose_path", return_value=compose),
              patch("devstack.webhooks.project_root", return_value=Path.cwd()),
              patch("devstack.webhooks.compose_command", return_value=[
                  "docker", "compose", "-p", "devstack-smoke",
                  "-f", str(compose),
              ]),
           ):
              client = create_webhook_app({"TESTING": True}).test_client()
              body = b'{"test":"webhook"}'
              assert client.post("/hooks/test", data=body).status_code == 503
              runtime._write({"phase": "active", "project": "smoke"})
              response = client.post("/hooks/test", data=body,
                  headers={"Content-Type": "application/json",
                           "X-Signature-Test": "signed"})
              assert response.status_code == 200, response.data
              assert response.data == body, response.data
              assert client.post("/hooks/not-allowed", data=body).status_code == 404
              assert client.post("/hooks/smoke/test", data=body).status_code == 404
              assert client.get("/hooks/test").status_code == 405
              runtime._write({"phase": "deactivating", "project": "smoke"})
              assert client.post("/hooks/test", data=body).status_code == 503
          PY
      - name: Verify actual activation and deactivation lifecycle
        run: |
          set -euo pipefail
          /tmp/devstack-webhook-ci/bin/python - <<'PY'
          import secrets
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          from devstack import runtime
          from devstack import docker_stacks
          from devstack.workspace import Project

          compose = Path.cwd() / "examples/smoke/.devstack/compose.yaml"
          cmd = ["docker", "compose", "-p", "devstack-smoke", "-f", str(compose)]
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              with (
                  patch("devstack.runtime._folder", return_value=root),
                  patch("devstack.runtime.load_project", return_value=Project("smoke", ())),
                  patch.object(docker_stacks, "compose_path", return_value=compose),
                  patch.object(docker_stacks, "compose_command", return_value=cmd),
                  patch.object(docker_stacks, "compose_name", return_value="devstack-smoke"),
                  patch.object(docker_stacks, "project_root", return_value=Path.cwd()),
              ):
                  activate = secrets.token_hex(12)
                  runtime._write({"phase": "activating", "project": "smoke", "token": activate})
                  assert runtime.perform("activate", "smoke", activate) == 0, runtime.status()
                  assert runtime.status()["phase"] == "active"
                  deactivate = secrets.token_hex(12)
                  runtime._write({"phase": "deactivating", "project": "smoke", "token": deactivate})
                  assert runtime.perform("deactivate", "smoke", deactivate) == 0, runtime.status()
                  assert runtime.status()["phase"] == "inactive"
                  assert not runtime._owned_ids("smoke"), "Inactive project retains containers"
                  volumes = __import__("subprocess").run([
                      "docker", "volume", "ls", "--quiet",
                      "--filter", "label=com.docker.compose.project=devstack-smoke",
                  ], check=True, capture_output=True, text=True)
                  assert volumes.stdout.strip(), "Deactivate unexpectedly removed named volumes"
          PY
      - name: Verify running image worker is stopped by deactivation
        run: |
          set -euo pipefail
          /tmp/devstack-webhook-ci/bin/python - <<'PY'
          import json, subprocess, tempfile, threading, time
          from pathlib import Path
          from unittest.mock import patch
          from devstack import command_runner, docker_stacks, runtime
          from devstack.workspace import Project

          name = "smoke"
          compose = Path.cwd() / "examples/smoke/.devstack/compose.yaml"
          cmd = ["docker", "compose", "-p", "devstack-smoke", "-f", str(compose)]
          with tempfile.TemporaryDirectory() as directory:
              folder = Path(directory)
              with (
                  patch("devstack.runtime._folder", return_value=folder),
                  patch("devstack.runtime.load_project", return_value=Project(name, ())),
                  patch.object(docker_stacks, "compose_path", return_value=compose),
                  patch.object(docker_stacks, "compose_command", return_value=cmd),
                  patch.object(docker_stacks, "compose_name", return_value="devstack-smoke"),
                  patch.object(command_runner, "compose_name", return_value="devstack-smoke"),
                  patch.object(command_runner, "project_root", return_value=Path.cwd()),
                  patch.object(docker_stacks, "project_root", return_value=Path.cwd()),
              ):
                  runtime._write({"phase": "active", "project": name})
                  identifier = "b" * 20
                  meta, log, marker = command_runner._paths(name, identifier)
                  command_runner._atomic_write(meta, json.dumps({
                      "id": identifier, "state": "queued", "started": time.time(),
                      "service": "", "mode": "run",
                      "image": "python:3.12-alpine", "network": "none",
                      "argv": ["python", "-c", "import time;time.sleep(120)"],
                  }))
                  log.touch()
                  worker = threading.Thread(target=command_runner.work,
                                            args=(name, identifier), daemon=True)
                  worker.start()
                  deadline = time.monotonic() + 30
                  while time.monotonic() < deadline:
                      containers = subprocess.run(
                          ["docker", "ps", "-q", "--filter",
                           "label=devstack.project=devstack-smoke"],
                          check=True, capture_output=True, text=True,
                      ).stdout.strip()
                      if containers:
                          break
                      time.sleep(.2)
                  else:
                      raise AssertionError("Task container did not start: " +
                                           command_runner.job_output(name, identifier))
                  runtime._write({"phase": "deactivating", "project": name,
                                  "token": "c" * 24})
                  assert runtime.perform("deactivate", name, "c" * 24) == 0, runtime.status()
                  worker.join(timeout=15)
                  assert not worker.is_alive(), "Task worker survived deactivation"
                  assert runtime.status()["phase"] == "inactive"
                  assert command_runner.get_job(name, identifier)["state"] == "cancelled"
                  assert not runtime._owned_ids(name), "Task container survived deactivation"
          PY
      - name: Inspect service logs
        if: always()
        run: docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke logs --no-color --tail 50
      - name: Clean up containers and volumes
        if: always()
        run: docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke down --volumes --remove-orphans
