name: Docker smoke integration

on:
  pull_request:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build frontend and verified wheel for integration
        run: |
          set -euo pipefail
          (cd frontend && npm ci --ignore-scripts --no-audit && npm run build)
          python3 -m pip install 'build==1.3.0'
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          python3 scripts/stage_standalone_updater.py
          python3 -m build --wheel --outdir dist
          python3 scripts/verify_release_wheel.py dist
      - name: Check Docker Compose
        run: docker compose version
      - name: Start smoke stack and verify health
        run: |
          set -euo pipefail
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke up -d --build --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:18080/health
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke ps
      - name: Validate imported Compose path base
        run: |
          set -euo pipefail
          tempdir="$(mktemp -d)"
          cp examples/smoke/.devstack/compose.yaml "$tempdir/compose.yaml"
          docker compose -p devstack-import-smoke \
            --project-directory "$PWD/examples/smoke/.devstack" \
            -f "$tempdir/compose.yaml" config --format json > "$tempdir/resolved.json"
          python3 - "$tempdir/resolved.json" "$PWD/examples/smoke/app" <<'PY'
          import json, pathlib, sys
          with open(sys.argv[1]) as stream:
              data = json.load(stream)
          actual = pathlib.Path(data["services"]["web"]["build"]["context"])
          expected = pathlib.Path(sys.argv[2])
          assert actual == expected, f"Expected build context {expected}, got {actual}"
          PY
      - name: Test Compose exec and one-off task commands
        run: |
          set -euo pipefail
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke \
            exec -T web python -m unittest discover -v
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke \
            run --rm --no-deps -T web python -m unittest discover -v
      - name: Test isolated images and optional Compose network
        run: |
          set -euo pipefail
          docker run --rm --network none --security-opt no-new-privileges \
            --cap-drop ALL python:3.12-alpine python --version
          network="$(docker network ls --quiet \
            --filter label=com.docker.compose.project=devstack-smoke \
            --filter label=com.docker.compose.network=default)"
          test "$(printf '%s\n' "$network" | sed '/^$/d' | wc -l)" -eq 1
          docker run --rm --network "$network" --security-opt no-new-privileges \
            --cap-drop ALL redis:7-alpine redis-cli -h redis ping
      - name: Verify installed v2 and v0.6 WSGI plus versioned browser assets
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/devstack-fresh-v05"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q --disable-pip-version-check dist/*.whl
          mkdir -p "$RUNNER_TEMP/devstack-wheels"
          cp dist/*.whl "$RUNNER_TEMP/devstack-wheels/"
          "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import os, zipfile
          wheels = list(Path(os.environ["RUNNER_TEMP"]).joinpath("devstack-wheels").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert "devstack/templates/app.html" in names, "React entry template missing"
              for legacy in (
                  "devstack/templates/dashboard.html",
                  "devstack/static/css/dashboard.css",
                  "devstack/static/js/api.js",
                  "devstack/templates/v2_dashboard.html",
                  "devstack/templates/v2_job.html",
                  "devstack/templates/v2_updates.html",
                  "devstack/static/css/v2.css",
                  "devstack/static/js/v2_dashboard.js",
              ):
                  assert legacy not in names, f"Legacy asset still packaged: {legacy}"
          from devstack.api.http import create_app
          app = create_app({"TESTING": True, "SESSION_COOKIE_SECURE": False})
          with app.test_client() as client:
              assert client.get("/static/css/v2.css").status_code == 404
              assert client.get("/static/js/v2_dashboard.js").status_code == 404
              # Pip-installed release must serve the sole React UI at the root.
              assert client.get("/").status_code == 200
              assert client.get("/projects/create").status_code == 200
              assert client.get("/projects/import").status_code == 200
              assert client.get("/unknown").status_code == 404
              assert client.get("/__v06").status_code == 308
              import importlib.metadata
              import json
              from pathlib import Path
              bundle = Path(app.static_folder) / "v06"
              manifest = json.loads((bundle / "manifest.json").read_text())
              paths = [manifest["src/main.tsx"]["file"]]
              paths.extend(entry["file"] for entry in manifest.values()
                           if entry["file"].endswith(".css"))
              for asset in paths:
                  assert client.get("/static/v06/" + asset).status_code == 200
              # The web process fails closed without its separate controller.
              assert client.get("/healthz").status_code == 503
          PY
      - name: Verify two independent v0.5.2 GitHub project imports
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devstack-fresh-v05/bin/python" - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import tempfile
          from devstack.storage.database import Database
          from devstack.storage.projects import ProjectRegistry
          from devstack.projects.workspaces import WorkspaceStore
          from devstack.projects.service import ProjectProvisioner

          url = "https://github.com/rafaelpivato/devstack/tree/main/examples/smoke"
          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              registry = ProjectRegistry(Database(root / "state" / "control.sqlite3"))
              store = WorkspaceStore(root / "workspaces")
              provisioner = ProjectProvisioner(registry, store)
              a = provisioner.import_github(url, "smoke-a", "Smoke A")
              b = provisioner.import_github(url, "smoke-b", "Smoke B")
              assert {p.id for p in registry.list()} == {a.id, b.id}
              assert a.id != b.id
              for project in (a, b):
                  meta = registry.import_metadata(project.id)
                  assert meta["branch"] == "main"
                  assert meta["subdirectory"] == "examples/smoke"
                  assert [app["name"] for app in meta["applications"]] == ["Web"]
                  assert any(task["name"] == "tests" for task in meta["tasks"])
                  template = provisioner.source_directory(project.id)
                  compose = store.path(project.id) / "managed" / "compose.yaml"
                  result = subprocess.run(
                      ["docker", "compose", "-p", "devstack-" + project.id,
                       "--project-directory", str(template),
                       "-f", str(compose), "config", "--format", "json"],
                      text=True, capture_output=True, check=True, timeout=40,
                  )
                  actual = Path(json.loads(result.stdout)["services"]["web"]["build"]["context"])
                  assert actual == template.parent / "app", (actual, template)
              assert not list(store.base.glob(".pending-*"))
              assert not list(subprocess.run(
                  ["docker", "ps", "--all", "--filter", "name=devstack-v052-",
                   "--format", "{{.ID}}"], check=True, text=True, capture_output=True
              ).stdout.splitlines()), "Import must not start runtime containers"
              print("Two independent v0.5.2 project imports completed without activation.")
          PY
      - name: Inspect service logs
        if: always()
        run: docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke logs --no-color --tail 50
      - name: Clean up containers and volumes
        if: always()
        run: docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke down --volumes --remove-orphans
      - name: Verify v0.5.2 real Docker A-to-B-to-A switching
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devstack-fresh-v05/bin/python" - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          from devstack.projects.workspaces import WorkspaceStore
          from devstack.projects.service import ProjectProvisioner
          from devstack.storage.database import Database
          from devstack.storage.projects import ProjectRegistry
          from devstack.control.docker import DockerBackend, compose_id
          from devstack.control.coordinator import Coordinator, ControlError
          from devstack.control.jobs import JobSupervisor
          from devstack.control.observability import ContainerObservability
          from devstack.control.private_ports import PrivateApplicationPorts
          from unittest.mock import patch
          from devstack.control.ingress import WebhookIngress, WebhookServer
          from http.client import HTTPConnection
          from uuid import uuid4
          import threading, time

          url = "https://github.com/rafaelpivato/devstack/tree/main/examples/smoke"
          with tempfile.TemporaryDirectory() as location:
              home = Path(location)
              db = Database(home / "state" / "control.sqlite3")
              registry = ProjectRegistry(db)
              workspaces = WorkspaceStore(home / "workspaces")
              service = ProjectProvisioner(registry, workspaces)
              a = service.import_github(url, "smoke-a", "Smoke A")
              b = service.import_github(url, "smoke-b", "Smoke B")
              backend = DockerBackend(service, workspaces)
              engine = Coordinator(db, registry, backend)
              jobs = JobSupervisor(engine, backend, workspaces)
              ingress = WebhookIngress(engine, registry, backend)
              engine.ingress = ingress
              for project in (a, b):
                  ingress.configure(project.id, "smoke", "web", 8000, "/webhooks/smoke")
              hook_server = WebhookServer(ingress, 0)
              hook_thread = threading.Thread(target=hook_server.serve_forever, daemon=True)
              hook_thread.start()
              def webhook(project_id, route="smoke"):
                  conn = HTTPConnection("127.0.0.1", hook_server.server_address[1], timeout=8)
                  try:
                      content = b'{"hello":"webhook"}'
                      conn.request("POST", "/hooks/" + project_id + "/" + route, content,
                                   headers={"Content-Type": "application/json",
                                            "Stripe-Signature": "signature-fixture"})
                      response = conn.getresponse()
                      return response.status, response.read()
                  finally:
                      conn.close()
              try:
                  assert engine.reconcile()["phase"] == "inactive"
                  first = engine.activate(a.id)
                  assert backend.owned() and all(
                      x["project"] == a.id and x["generation"] == first["generation"]
                      for x in backend.owned()
                  ), backend.owned()
                  assert webhook(a.id) == (200, b'{"hello":"webhook"}')
                  # Read-only v2 Compose observability must never switch
                  # projects or disclose another project's containers.
                  observer = ContainerObservability(engine, backend)
                  services_a = observer.services(a.id)
                  assert services_a["active"], services_a
                  assert services_a["services"], services_a
                  postgres = next(
                      x for x in services_a["services"] if x["name"] == "postgres"
                  )
                  assert postgres["status"] == "running", postgres
                  assert len(postgres["containers"]) == 1, postgres
                  container_id = postgres["containers"][0]["id"]
                  assert len(container_id) == 64
                  assert postgres["containers"][0]["state"] == "running"
                  log_preview = observer.logs(a.id, container_id, 20)
                  assert log_preview["service"] == "postgres", log_preview
                  assert log_preview["tail"] == 20, log_preview
                  assert len(log_preview["text"].encode("utf-8")) <= 65536
                  assert observer.services(b.id) == {
                      "project_id": b.id, "active": False, "services": []
                  }
                  # This fixture deliberately exposes web on 127.0.0.1 only.
                  # Even with a working Tailscale IPv4, that loopback port
                  # must NOT be mistaken for a tailnet-private published URL.
                  private_ports = PrivateApplicationPorts(engine, backend)
                  with patch("devstack.control.private_ports.tailscale_ipv4",
                             return_value="100.98.76.54"):
                      assert private_ports.list(a.id) == {
                          "project_id": a.id, "active": True,
                          "tailscale_available": True, "ports": [],
                          "applications": [],
                      }
                      assert private_ports.list(b.id) == {
                          "project_id": b.id, "active": False,
                          "tailscale_available": False, "ports": [],
                          "applications": [],
                      }

                  try:
                      observer.logs(b.id, container_id, 20)
                      raise AssertionError("inactive project read Docker logs")
                  except ControlError:
                      pass
                  assert webhook(b.id)[0] == 503
                  assert webhook(str(uuid4()))[0] == 404
                  compose_a = backend.command(a.id)
                  subprocess.run(
                      compose_a + ["exec", "-T", "postgres", "sh", "-c",
                                   "echo persistent > /var/lib/postgresql/data/devstack-check"],
                      check=True, timeout=30,
                  )
                  # AC-17: multiple long-running commands do not block each other.
                  # Independent cancellation must preserve other jobs and Compose services.
                  def running_container(job_id):
                      inspection = subprocess.run(
                          ["docker", "inspect", "--type", "container", "--",
                           "devstack-task-" + job_id],
                          text=True, capture_output=True, timeout=20,
                      )
                      return inspection.returncode == 0

                  first_long = jobs.submit_adhoc(
                      a.id, "image", "", "python:3.12-alpine", "none",
                      ["python", "-c", "import time;time.sleep(120)"],
                  )
                  second_long = jobs.submit_adhoc(
                      a.id, "image", "", "python:3.12-alpine", "none",
                      ["python", "-c", "import time;time.sleep(120)"],
                  )
                  deadline = time.monotonic() + 70
                  while time.monotonic() < deadline:
                      if (jobs.get(first_long)["status"] == "running"
                              and jobs.get(second_long)["status"] == "running"
                              and running_container(first_long)
                              and running_container(second_long)):
                          break
                      time.sleep(.4)
                  assert running_container(first_long) and running_container(second_long), (
                      jobs.get(first_long), jobs.get(second_long)
                  )
                  fast = jobs.submit_adhoc(
                      a.id, "image", "", "python:3.12-alpine", "none",
                      ["python", "-c", "print('third job completed')"],
                  )
                  deadline = time.monotonic() + 30
                  while time.monotonic() < deadline and jobs.get(fast)["status"] in ("queued","running"):
                      time.sleep(.2)
                  assert jobs.get(fast)["status"] == "succeeded", jobs.get(fast)
                  assert jobs.get(first_long)["status"] == "running"
                  assert jobs.cancel(a.id, second_long)["status"] == "cancelled"
                  assert not running_container(second_long)
                  assert jobs.get(first_long)["status"] == "running"
                  assert engine.status()["phase"] == "active"
                  assert webhook(a.id) == (200, b'{"hello":"webhook"}')
                  assert jobs.cancel(a.id, first_long)["status"] == "cancelled"
                  assert not running_container(first_long)
                  assert backend.verify(a.id, first["generation"]) is None

                  # Supervise an actual long-lived disposable Docker image task.
                  with db.transaction(write=True) as con:
                      con.execute(
                          "INSERT INTO tasks(project_id,name,service,mode,image,network,argv_json)"
                          " VALUES (?,'wait','', 'run','python:3.12-alpine','none',?)",
                          (a.id, '["python","-c","import time;time.sleep(120)"]'),
                      )
                  job_id = jobs.submit_task(a.id, "wait")
                  deadline = time.monotonic() + 20
                  while jobs.get(job_id)["status"] == "queued" and time.monotonic() < deadline:
                      time.sleep(.1)
                  assert jobs.get(job_id)["status"] == "running", jobs.get(job_id)
                  second = engine.switch(b.id)
                  assert jobs.get(job_id)["status"] == "cancelled", jobs.get(job_id)
                  assert second["project_id"] == b.id
                  assert webhook(b.id) == (200, b'{"hello":"webhook"}')
                  assert webhook(a.id)[0] == 503
                  assert all(x["project"] == b.id for x in backend.owned())
                  assert not engine.authorized(a.id, first["generation"])
                  third = engine.switch(a.id)
                  assert third["project_id"] == a.id
                  assert webhook(a.id) == (200, b'{"hello":"webhook"}')
                  assert third["generation"] != first["generation"]
                  assert all(x["project"] == a.id for x in backend.owned())
                  output = subprocess.run(
                      backend.command(a.id) + ["exec", "-T", "postgres", "cat",
                                             "/var/lib/postgresql/data/devstack-check"],
                      check=True, text=True, capture_output=True, timeout=30,
                  ).stdout.strip()
                  assert output == "persistent", output
                  assert engine.deactivate()["phase"] == "inactive"
                  assert not backend.owned()
                  assert len(registry.list()) == 2
                  print("Two GitHub projects switched A-B-A, no overlap, volume persisted")
              finally:
                  hook_server.shutdown()
                  hook_thread.join(timeout=8)
                  hook_server.server_close()
                  for p in (a, b):
                      try:
                          backend.stop(p.id)
                      except Exception as exc:
                          print("Cleanup failure:", exc)
                          raise
          PY

  systemd-privilege-boundary:
    name: Fresh Ubuntu systemd and Unix-socket permissions
    needs: compose-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build frontend and verified wheel for integration
        run: |
          set -euo pipefail
          (cd frontend && npm ci --ignore-scripts --no-audit && npm run build)
          python3 -m pip install 'build==1.3.0'
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          python3 scripts/stage_standalone_updater.py
          python3 -m build --wheel --outdir dist
          python3 scripts/verify_release_wheel.py dist
      - name: Verify actual web/controller Linux identities and restart
        env:
          DEVSTACK_EPHEMERAL_CI: "1"
        run: |
          export DEVSTACK_CI_WHEEL="$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$DEVSTACK_CI_WHEEL"
          sudo --preserve-env=DEVSTACK_EPHEMERAL_CI,DEVSTACK_CI_WHEEL bash scripts/verify-systemd-ci.sh
      - name: Inspect systemd diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status devstack-ci-control.service devstack-ci-web.service --no-pager || true
          sudo journalctl -u devstack-ci-control.service -u devstack-ci-web.service --no-pager -n 160 || true
