name: Docker smoke integration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Compose
        run: docker compose version
      - name: Start smoke stack and verify health
        run: |
          set -euo pipefail
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke up -d --build --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:18080/health
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke ps
      - name: Validate imported Compose path base
        run: |
          set -euo pipefail
          tempdir="$(mktemp -d)"
          cp examples/smoke/.devstack/compose.yaml "$tempdir/compose.yaml"
          docker compose -p devstack-import-smoke \
            --project-directory "$PWD/examples/smoke/.devstack" \
            -f "$tempdir/compose.yaml" config --format json > "$tempdir/resolved.json"
          python3 - "$tempdir/resolved.json" "$PWD/examples/smoke/app" <<'PY'
          import json, pathlib, sys
          with open(sys.argv[1]) as stream:
              data = json.load(stream)
          actual = pathlib.Path(data["services"]["web"]["build"]["context"])
          expected = pathlib.Path(sys.argv[2])
          assert actual == expected, f"Expected build context {expected}, got {actual}"
          PY
      - name: Test Compose exec and one-off task commands
        run: |
          set -euo pipefail
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke \
            exec -T web python -m unittest discover -v
          docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke \
            run --rm --no-deps -T web python -m unittest discover -v
      - name: Test isolated images and optional Compose network
        run: |
          set -euo pipefail
          docker run --rm --network none --security-opt no-new-privileges \
            --cap-drop ALL python:3.12-alpine python --version
          network="$(docker network ls --quiet \
            --filter label=com.docker.compose.project=devstack-smoke \
            --filter label=com.docker.compose.network=default)"
          test "$(printf '%s\n' "$network" | sed '/^$/d' | wc -l)" -eq 1
          docker run --rm --network "$network" --security-opt no-new-privileges \
            --cap-drop ALL redis:7-alpine redis-cli -h redis ping
      - name: Validate preview proxy against real smoke Compose containers
        run: |
          set -euo pipefail
          python3 -m venv /tmp/devstack-preview-ci
          /tmp/devstack-preview-ci/bin/pip install -q -e .
          /tmp/devstack-preview-ci/bin/python - <<'PY'
          from pathlib import Path
          from unittest.mock import patch
          from devstack.preview import create_preview_app
          from devstack.applications import Application
          from devstack.core import Project

          root = Path.cwd()
          compose = root / "examples/smoke/.devstack/compose.yaml"
          with (
              patch("devstack.preview.load_projects", return_value={
                  "smoke": Project("smoke", (), ())
              }),
              patch("devstack.preview.load_applications", return_value=(
                  Application("Web", "web", 8000),
              )),
              patch("devstack.preview.compose_path", return_value=compose),
              patch("devstack.preview.project_root", return_value=root),
              patch("devstack.preview.compose_name", return_value="devstack-smoke"),
              patch("devstack.preview.compose_command", return_value=[
                  "docker", "compose", "-p", "devstack-smoke",
                  "-f", str(compose),
              ]),
          ):
              client = create_preview_app({"TESTING": True}).test_client()
              response = client.get("/p/smoke/Web/health")
              assert response.status_code == 200, response.data
              assert response.data == b"devstack smoke ok\n", response.data
              assert "Set-Cookie" not in response.headers
          PY
      - name: Inspect service logs
        if: always()
        run: docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke logs --no-color --tail 50
      - name: Clean up containers and volumes
        if: always()
        run: docker compose -f examples/smoke/.devstack/compose.yaml -p devstack-smoke down --volumes --remove-orphans
