# Temporary only for the I4 bundle. Remove before integration merge.
name: Bootstrap I4 frontend assets
on:
  push:
    branches: [feat/v060-repository-workflows]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.repository == 'rafaelpivato/devstack'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build tracked release assets
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Commit generated bundle
        run: |
          git add -f src/devstack/static/v06/manifest.json src/devstack/static/v06/assets
          git add -u src/devstack/static/v06
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(v0.6 I4): track repository workflow bundle"
          git push origin HEAD:feat/v060-repository-workflows
