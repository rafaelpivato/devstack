name: One-time v0.6.1 frontend asset regeneration
on:
  push:
    branches:
      - fix/v061-mobile-polish
    paths:
      - .github/workflows/v061-build-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend using locked dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit
          npm run typecheck
          npm test
          npm run build
      - name: Commit deterministic assets and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/v061-build-once.yml
          git add -A src/devstack/static/v06 .github/workflows/v061-build-once.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "build(v0.6.1): record reproducible frontend assets"
          git push origin HEAD:refs/heads/fix/v061-mobile-polish
