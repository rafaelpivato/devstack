# Temporary diagnostic for npm audit 400 on PR #78. REMOVE after verification.
name: R1 npm audit diagnostic
on:
  push:
    branches: [feat/v060-r1-release-candidate]
permissions:
  contents: write
jobs:
  audit-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Inspect lockfile and npm versions
        working-directory: frontend
        run: |
          node --version
          npm --version
          npm config get registry
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --stat -- package-lock.json
          if git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_REGENERATED_UNCHANGED=true"
          else
            echo "LOCKFILE_REGENERATED_UNCHANGED=false"
            git diff -- package-lock.json | head -n 120 || true
          fi
      - name: Commit canonical lockfile if npm regenerated it
        run: |
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile regeneration needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(v0.6 R1): regenerate canonical npm dependency lockfile"
          git push origin HEAD:feat/v060-r1-release-candidate
      - name: Record registry audit result
        working-directory: frontend
        run: |
          set +e
          npm audit --json --audit-level=low > /tmp/r1-npm-audit.json 2>/tmp/r1-npm-audit-stderr.txt
          result=$?
          set -e
          echo "npm audit exit code: $result"
          node -e 'const fs=require("node:fs");const raw=fs.readFileSync("/tmp/r1-npm-audit.json","utf8");try {const a=JSON.parse(raw);console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,error:a.error,advisories:Object.keys(a.vulnerabilities||{})},null,2));}catch{console.log("non-JSON audit response:",raw.slice(0,1200));}}'
          sed -n '1,24p' /tmp/r1-npm-audit-stderr.txt
          exit "$result"
