[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devstack"
version = "0.1.3"
description = "Mobile-first controller for remote Linux development projects"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "gunicorn>=23,<24"]

[project.scripts]
devstack = "devstack.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devstack = ["templates/*.html"]
