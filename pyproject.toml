[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devstack"
version = "0.5.3"
description = "Mobile-first controller for remote Linux development projects"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "gunicorn>=23,<24"]

[project.scripts]
devstack-control = "devstack.control.daemon:main"
devstack-web-v2 = "devstack.api.http:main"
dev = "devstack.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devstack = ["templates/*.html", "static/css/*.css", "static/js/*.js",
    "static/v06/manifest.json", "static/v06/assets/*.js", "static/v06/assets/*.css"]
