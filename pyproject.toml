[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "devstack"
version = "0.6.8"
description = "Mobile-first controller for remote Linux development projects"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "gunicorn>=23,<24"]

[project.scripts]
devstack-control = "devstack.control.daemon:main"
devstack-web-v2 = "devstack.api.http:main"
dev = "devstack.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devstack = ["templates/app.html",
    "static/v06/manifest.json", "static/v06/assets/*", "static/v06/assets/**/*", "_standalone_updater.py"]
