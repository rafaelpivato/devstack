<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="devstack-csrf" content="{{ csrf }}">
  <title>DevStack · Projects</title>
  <!-- Resolve theme before styles load; avoid a first-paint flash on iPhone. -->
  <script>
    (function () {
      var choice;
      try { choice = localStorage.getItem("devstack-appearance-v1"); } catch (_) {}
      var dark = choice === "dark" || (choice !== "light" &&
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  {% for asset in css_assets %}<link rel="stylesheet" href="{{ url_for('static', filename='v06/' + asset) }}">{% endfor %}
  <script type="module" src="{{ url_for('static', filename='v06/' + js_asset) }}"></script>
</head>
<body><div id="app"></div></body>
</html>
